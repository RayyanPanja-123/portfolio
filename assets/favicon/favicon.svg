<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- coin: dark rim, emerald ring, dark field -->
  <circle cx="32" cy="32" r="31" fill="#0E1512"/>
  <circle cx="32" cy="32" r="28.5" fill="#1E9E6A"/>
  <circle cx="32" cy="32" r="23" fill="#0E1512"/>

  <g fill="#2FB37A" stroke="#0E1512" stroke-width="1.6" stroke-linejoin="round">
    <!-- swept-back crest horns, breaking out over the ring -->
    <path d="M27 30 L9 9 L22 14 L31 26 Z"/>
    <path d="M31 26 L29 4 L37 13 L37 24 Z"/>
    <!-- head facing right, jaw slightly open -->
    <path d="M21 35 C21 27 29 22 38 24 L53 30 C56 32 55 36 51 37 L43 38 L51 44 C47 48 41 47 37 45 C33 51 24 51 21 45 Z"/>
  </g>

  <!-- line detail -->
  <g fill="none" stroke="#0E1512" stroke-width="1.4" stroke-linecap="round">
    <path d="M37 45 L43 38"/>
    <path d="M25 39 C29 37 33 38 38 34"/>
    <path d="M44 31 L49 32"/>
  </g>

  <!-- gold eye -->
  <path d="M35 29 L42 30.5 L36.5 32.5 Z" fill="#F2C94C"/>
</svg>
